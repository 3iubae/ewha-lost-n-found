<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost n Found - Add Item</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* Add page only */
    main { max-width: 600px; margin: 0 auto; padding: 1rem; }
    input, select, textarea { width: 100%; padding: 0.5rem; font-size: 1rem; }
    textarea { min-height: 6rem; }
  </style>
</head>
<body>

  <header>
    <h1>lostnfound</h1>
    <nav>
      <div>
        <a href="add.html">add</a>
        <a href="search.html">search</a>
      </div>
      <div>
        <a href="#" id="logout-button">logout</a>
        <a href="profile.html">mypage</a>
      </div>
    </nav>
  </header>

  <main>
    <h2>Add</h2>

    <form id="add-form">
      <p>
        <label for="photos">Photos</label><br>
        <input type="file" id="photos" accept="image/jpeg,image/png,image/webp" multiple required>
      </p>
      <p>
        <label for="name">Name</label><br>
        <input type="text" id="name" required>
      </p>
      <p>
        <label for="category">Category</label><br>
        <select id="category" required>
          <option value="">Select a category</option>
        </select>
      </p>
      <p>
        <label for="found-date">Date Found</label><br>
        <input type="date" id="found-date" required>
      </p>
      <p>
        <label for="found-location">Location Found</label><br>
        <input type="text" id="found-location" required>
      </p>
      <p>
        <label for="storage-location">Storage Location</label><br>
        <input type="text" id="storage-location" required>
      </p>
      <p>
        <label for="description">Description</label><br>
        <textarea id="description"></textarea>
      </p>
      <button type="submit">Submit</button>
    </form>

    <!-- Upload result message -->
    <p id="message"></p>
  </main>

  <footer>
    <p>&copy; 2026 Gitastic5. All rights reserved.</p>
  </footer>

  <!-- Supabase JS library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- browser-image-compression: compresses photos before upload (NFR-03) -->
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/add.js"></script>
</body>
</html>
